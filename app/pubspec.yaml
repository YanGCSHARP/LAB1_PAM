name: walletmate
description: "WalletMate — personal finance tracker: accounts, transactions, monthly budgets."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Russian labels inside Material widgets (date picker, text selection).
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Money and date formatting for the ru locale.
  intl: ^0.20.2

  # Expense breakdown chart on the dashboard.
  fl_chart: ^1.1.1

  # Declarative routes, the tab shell and deep links such as /transactions/:id.
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  equatable: ^2.1.0

  # HTTP client for the backend: base URL, JWT interceptor, multipart upload.
  dio: ^5.11.1

  # The JWT, kept in the platform keystore rather than in plain preferences.
  flutter_secure_storage: ^11.2.0

  # Picking the avatar from the gallery.
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter is bundled instead of fetched through google_fonts: the app must work
  # fully offline, and a network-loaded font would break that.
  # Inter v4.1 by Rasmus Andersson, SIL Open Font License 1.1
  # (assets/fonts/Inter-LICENSE.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Optical size cut for large numerals: tighter spacing, smaller apertures.
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
