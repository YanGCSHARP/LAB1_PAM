name: walletmate
description: "WalletMate — personal finance tracker: accounts, transactions, monthly budgets."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Money and date formatting for the ru locale.
  intl: ^0.20.2

  # Expense breakdown chart on the dashboard.
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
